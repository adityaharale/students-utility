<!DOCTYPE html>
<html>
<head>
<title>Attendance Calculator</title>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#020617;color:#fff;font-family:Arial;text-align:center;padding:30px;}
input,button{padding:10px;margin:10px;border-radius:8px;border:none;}
button{background:#38bdf8;font-weight:bold;}
</style>
</head>
<body>

<h2>Attendance Calculator</h2>

<input type="number" id="total" placeholder="Total Lectures">
<input type="number" id="att" placeholder="Attended Lectures"><br>
<button onclick="calc()">Calculate</button>

<p id="res"></p>

<footer>Created by Aditya Harale</footer>

<script>
function calc(){
 let p=(att.value/total.value)*100;
 res.innerText="Attendance: "+p.toFixed(2)+"%";
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>

</html>
