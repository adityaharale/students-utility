<!DOCTYPE html>
<html>
<head>
<title>Percentage Calculator</title>
<style>
body{background:#020617;color:#fff;font-family:Arial;text-align:center;padding:30px;}
input,button{padding:10px;margin:10px;border-radius:8px;border:none;}
button{background:#38bdf8;font-weight:bold;}
</style>
</head>
<body>

<h2>Percentage Calculator</h2>

<input type="number" id="obt" placeholder="Obtained Marks">
<input type="number" id="tot" placeholder="Total Marks"><br>
<button onclick="calc()">Calculate</button>

<p id="res"></p>

<footer>Created by Aditya Harale</footer>

<script>
function calc(){
 let o=obt.value,t=tot.value;
 if(o&&t) res.innerText="Percentage: "+((o/t)*100).toFixed(2)+"%";
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
